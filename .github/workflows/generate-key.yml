name: Generate Keystore
on: workflow_dispatch
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS and Base64
        run: |
          keytool -genkeypair -v -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -storepass gyH0RBAAveJmkW \
            -keypass gyH0RBAAveJmkW \
            -dname "CN=AnytimeFork, OU=Dev, O=Personal, L=Local, S=State, C=US"
          echo "=== COPY EVERYTHING BELOW THIS LINE ==="
          base64 -w 0 release.jks
          echo ""
          echo "=== COPY EVERYTHING ABOVE THIS LINE ==="
